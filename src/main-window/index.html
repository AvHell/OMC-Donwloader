<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMC Downloader</title>

  <!-- Fuente Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Estilos principales -->
  <link rel="stylesheet" href="mainwindow.css" />

  <!-- Módulos JS -->
  <script src="js/main-utils.js"></script>
  <script src="js/main-toast.js"></script>
  <script src="js/main-queue.js"></script>
  <script src="js/main-modal.js"></script>
  <script src="js/main-editor.js"></script>
  <script src="js/main-app.js"></script>
</head>
<body>

  <!-- Fondo animado -->
  <div class="bg-waves"></div>

  <!-- OVERLAY DE CARGA GLOBAL -->
  <div id="loading-overlay">
    <div class="loader-container">
      <div class="loader-spinner">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <p class="loader-text" id="loader-text">Cargando...</p>
      <div class="loader-progress">
        <div class="loader-progress-bar" id="loader-progress-bar" style="width:0%;"></div>
      </div>
      <span class="loader-percent" id="loader-percent">0%</span>
    </div>
  </div>

  <!-- CONTENEDOR PRINCIPAL CON BARRA LATERAL -->
  <div class="app-wrapper">

    <!-- BARRA LATERAL IZQUIERDA -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <i class="fas fa-cloud-download-alt"></i>
        <span>OMC</span>
      </div>
      <ul class="sidebar-menu">
        <li>
          <button id="btn-new-link" class="sidebar-btn" title="Nuevo enlace">
            <i class="fas fa-plus"></i>
            <span>Nuevo</span>
          </button>
        </li>
        <li>
          <button id="btn-start" class="sidebar-btn" title="Iniciar descargas" disabled>
            <i class="fas fa-play"></i>
            <span>Descargar</span>
          </button>
        </li>
        <li>
          <button id="btn-update-ytdlp" class="sidebar-btn" title="Actualizar yt-dlp">
            <svg class="updater-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg>
            <span>Actualizar</span>
          </button>
        </li>
        <li>
          <button id="btn-toggle-console" class="sidebar-btn" title="Consola de logs">
            <i class="fas fa-terminal"></i>
            <span>Consola</span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">

      <!-- HEADER (con botón de limpiar en lugar del badge) -->
      <header class="app-header">
        <div class="header-content">
          <div class="logo">
            <i class="fas fa-cloud-download-alt"></i>
            <span>OMC Downloader</span>
          </div>
          <div class="header-actions">
            <button id="btn-clear-queue" class="btn btn-secondary" disabled style="padding:6px 16px; font-size:var(--font-size-body); border-radius:8px; gap:6px;">
              <i class="fas fa-trash-alt"></i> Limpiar cola
            </button>
          </div>
        </div>
      </header>

      <!-- CUERPO PRINCIPAL (cola) -->
      <main class="main-card">
        <section class="logs-section">
          <div class="logs-header">
            <span><i class="fas fa-list"></i> Cola de descargas</span>
            <span id="queue-count">0 elementos</span>
          </div>
          <div id="queue-list" class="log-area"></div>
        </section>
      </main>

      <!-- FOOTER (actualizador) -->
      <footer class="app-footer">
        <div class="footer-left">
          <div class="updater-section">
            <span id="app-update-status" class="app-update-status">Actualización de app sin comprobar</span>
            <button id="btn-update-app" class="btn btn-secondary" type="button">
              <svg class="updater-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M4 17v3h16v-3"/></svg> Buscar actualización
            </button>
          </div>
        </div>
        <span class="footer-copy">OMC Downloader v1.0</span>
      </footer>

    </div>
  </div>

  <!-- PANEL DE CONSOLA (se muestra/oculta con el botón) -->
  <div id="console-panel">
    <div class="console-header">
      <div class="console-heading">
        <span class="console-session-brand"><svg id="console-session-logo-fallback" class="console-session-logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 28 10v12l-12 7L4 22V10z"/><path d="m11 13 4 3-4 3m7 0h4"/></svg><img id="console-session-art" class="console-session-art" alt="" hidden> Sesión de descarga</span>
        <span id="console-session-title" class="console-session-title">Sin descargas activas</span>
        <span id="console-session-id" class="console-session-id">En espera</span>
        <span id="console-log-count" class="console-log-count">0 eventos</span>
      </div>
      <button id="btn-close-console" class="btn-icon" title="Cerrar consola">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div id="console-output" class="console-output"></div>
    <div class="console-actions">
      <button id="btn-clear-console" class="btn btn-secondary">Limpiar</button>
    </div>
  </div>

  <!-- MODAL GLOBAL (para agregar/editar) -->
  <div id="modal-overlay">
    <div id="modal-content"></div>
  </div>

  <!-- MODAL DE CAPÍTULOS (editor) -->
  <div id="chapter-modal-overlay">
    <div id="chapter-modal-content"></div>
  </div>

</body>
</html>
