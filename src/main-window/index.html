<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMC Downloader</title>

  <!-- Fuente Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Estilos principales -->
  <link rel="stylesheet" href="mainwindow.css" />

  <!-- Módulos JS -->
  <script src="js/main-utils.js"></script>
  <script src="js/main-toast.js"></script>
  <script src="js/main-queue.js"></script>
  <script src="js/main-modal.js"></script>
  <script src="js/main-editor.js"></script>
  <script src="js/main-app.js"></script>
</head>
<body>

  <!-- Fondo animado -->
  <div class="bg-waves"></div>

  <!-- OVERLAY DE CARGA GLOBAL -->
  <div id="loading-overlay">
    <div class="loader-container">
      <div class="loader-spinner">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <p class="loader-text" id="loader-text">Cargando...</p>
      <div class="loader-progress">
        <div class="loader-progress-bar" id="loader-progress-bar" style="width:0%;"></div>
      </div>
      <span class="loader-percent" id="loader-percent">0%</span>
    </div>
  </div>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="app-container">

    <!-- HEADER (con dos botones) -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo">
          <i class="fas fa-cloud-download-alt"></i>
          <span>OMC Downloader</span>
        </div>
        <div class="header-actions">
          <button id="btn-new-link" class="btn btn-primary">
            <i class="fas fa-plus"></i> Nuevo
          </button>
          <button id="btn-start" class="btn btn-success" disabled>
            <i class="fas fa-play"></i> Descargar
          </button>
        </div>
      </div>
    </header>

    <!-- CUERPO PRINCIPAL (solo la cola) -->
    <main class="main-card">
      <section class="logs-section">
        <div class="logs-header">
          <span><i class="fas fa-list"></i> Cola de descargas</span>
          <span id="queue-count">0 elementos</span>
        </div>
        <div id="queue-list" class="log-area"></div>
      </section>
    </main>

    <!-- FOOTER (solo actualizador) -->
    <footer class="app-footer">
      <div class="footer-left">
        <div class="updater-section">
          <span id="ytdlp-version" class="version-indicator" title="Versión de yt-dlp">
            <i class="fas fa-code-branch"></i>
            <span id="version-text">--</span>
          </span>
          <button id="btn-update-ytdlp" class="btn-update" title="Buscar actualizaciones de yt-dlp">
            <i class="fas fa-sync-alt"></i> Actualizar
          </button>
        </div>
      </div>
      <span class="footer-copy">OMC Downloader v1.0</span>
    </footer>
  </div>

  <!-- MODAL GLOBAL (para agregar/editar) -->
  <div id="modal-overlay">
    <div id="modal-content"></div>
  </div>

  <!-- MODAL DE CAPÍTULOS (editor) -->
  <div id="chapter-modal-overlay">
    <div id="chapter-modal-content"></div>
  </div>

</body>
</html>
